<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hana Tamer Mohaseb - Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Hana Tamer Mohaseb</h1>
        <p>Computer Engineering & Software Systems Student</p>
        <nav>
            <a href="#about">About</a> |
            <a href="#projects">Projects</a> |
            <a href="#contact">Contact</a>
        </nav>
    </header>


    <section id="about">
        <h2>About Me</h2>
        <div class="about-content">
            <p>
                Hello! I am a Computer Engineering student studying at Ain Shams University 
            </p>
        </div>
    </section>

    <section id="projects">
        <h2>Projects</h2>
        <div class="projects-container">
            <div class="project-card">
                <h3>Event Management System</h3>
            </div>
            <div class="project-card">
                <h3>Vehicle Rental System</h3>
            </div>
            <div class="project-card">
                <h3>Food Shop Website</h3>
            </div>
        </div>
    </section>

    <section id="contact">
        <h2>Contact Me</h2>
        <form class="contact-form" action="#" method="post">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" required placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label for="email">Your Email</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" required placeholder="Write your message here..."></textarea>
            </div>
            <button type="submit" class="submit-btn">Send Message</button>
        </form>
    </section>

</body>
</html>
