<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Todo App</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <h1>Todo App</h1>

    <form id="taskForm">
      <input id="taskInput" type="text" placeholder="Add a task">
      <button type="submit">Add</button>
    </form>

    <ul id="taskList"></ul>
  </main>
</body>
</html>
